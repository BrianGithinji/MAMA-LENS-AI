services:
  - type: web
    name: mama-lens-ai
    runtime: python
    region: oregon
    plan: free
    rootDir: backend/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    branch: master

    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: mamalens
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: ALLOWED_ORIGINS
        value: '["https://mama-lens.netlify.app"]'
      - key: HF_MODEL_ID
        value: BrianGithinji/mama-flan-t5
      - key: HF_HOME
        value: /tmp/hf_cache
      - key: HF_API_TOKEN
        sync: false
